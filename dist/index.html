ight:1.5;min-height:42px;text-align:center;color:#adbba9;margin:0}.caption{display:flex;justify-content:space-between;color:#899987;font-size:13px;gap:12px}.active{color:#d8fc71}@media(min-width:700px){main{max-width:480px}}@media(orientation:landscape) and (max-height:600px){main{max-width:1000px;display:grid;grid-template-columns:minmax(200px,1fr) minmax(240px,1fr);gap:16px 32px}header{grid-column:1/-1}.stage{max-width:65svh;justify-self:center}.controls{align-content:center}.caption{grid-column:1/-1}}
